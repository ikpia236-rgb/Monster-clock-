<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>JS clock</title>
	<style>
		body {
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: start;
			background-color: rgb(245, 186, 215);

		}
		.container {
			width: 600px;
			height: 800px;
			background-color: purple;
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			
			margin-top: 200px;
		}
		.hour, .minute, .second {
			width: 600px;
			height: 2px;
			background-color: red;

		}
		.second {
			width: 160px;
			height: 160px;
			border-radius: 50%;
			background-color:white;
			flex-shrink: 0;
		}
		.dot {
			width: 100px;
			height: 100px;
			background-color: skyblue;
			border-radius: 50%;
			position: absolute;
			margin-top: 50px;
			margin-left: 10px;
			
		}
		.pupil {
			width: 50px;
			height: 50px;
			background-color: black;
			border-radius: 50%;
			margin-top: 40px;
			margin-left: 20px;
			
		}
		.minute .dot {
			margin-top: 50px;
			margin-left: 10px;
			background-color: rgb(137, 248, 137);
		}
		.minute{
			width: 160px;
			height: 160px;
			border-radius: 50%;
			background-color:white;
			flex-shrink: 0;
		}
		.hour{
			width: 160px;
			height: 160px;
			border-radius: 50%;
			background-color:white;
			flex-shrink: 0;
		}
		.hour .dot {
			margin-top: 50px;
			margin-left: 10px;
			background-color: rgb(102, 26, 26);
		}

		.mouth {
			width: 230px;
			height: 100px;
			
			border-radius: 0 0 100px 100px;
			position: absolute;
			margin-top: 500px;
			border: 5px solid hotpink;
			background-color: white;
		}
		.top {
			width: 100px;
			height: 20px;
			background-color: white;
			position: absolute;
			margin-top: 250px;
			border-radius: 50%;
		}
		.head
	{
			width: 15px;
			height: 70px;
			background-color: purple;
			position: absolute;
			margin-top: -850px;
			
		}
		.head:nth-child(3)
		{
			margin-left: 100px;
			rotate: 30deg;
		}
		.head:nth-child(4)
		{
			margin-left: -100px;
			rotate: -30deg;
		}
	.circle
	{
			width: 20px;
			height: 20px;
			background-color:purple;
			position: absolute;
			margin-top: -930px;
			border-radius: 50%;
		}
		.circle:nth-child(6)
		{
			margin-left: 143px;
			margin-top: -915px;
		}
		.circle:nth-child(7)
		{
			margin-left: -143px;
			margin-top: -915px;	
		}


	</style>
</head>
<body>
	
	<div class="container">
		<div class="top"></div>
		<div class="head"></div>
		<div class="head">	</div>
		<div class="head"></div>
		<div class="circle"></div>
		<div class="circle"></div>
		<div class="circle"></div>
		
		<div class="hour">
			<div class="dot">
				<div class="pupil">
				</div>
			</div>
		</div>
		<div class="minute">
			<div class="dot">
				<div class="pupil">
				</div>
			</div>
		</div>
		<div class="second">
			<div class="dot">
				<div class="pupil">
				</div>
			</div>
			
			 </div>
	<div class="mouth">
		
	</div>	
	

<script>
  const hour = document.querySelector(".hour")
  const minute = document.querySelector(".minute")
  const second = document.querySelector(".second");

  function tick() {
    const hours = new Date().getHours(); // 0–12
	const minutes = new Date().getMinutes(); // 0–59
	const seconds = new Date().getSeconds(); // 0–59


    hour.style.transform = `rotate(${hours * 30}deg)`;
    minute.style.transform = "rotate(" + (minutes * 6) + "deg)";
    second.style.transform = `rotate(${seconds * 6}deg)`;
  }

  tick();
  setInterval(tick, 1000);
</script>
</script>
</body>
</html>
